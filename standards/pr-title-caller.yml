# Copy to <repo>/.github/workflows/pr-title.yml
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    # The called workflow can use only what is granted here; a private repo's default leaves pull-requests at none.
    permissions:
      pull-requests: read
    uses: kleviszeneli/.github/.github/workflows/pr-title.yml@main
